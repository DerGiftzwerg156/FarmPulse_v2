# Lokale MariaDB fuer die Backend-Entwicklung. Start: docker compose up -d
# Verbindungsdaten passen zu den Defaults in src/main/resources/application.yml.
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: farmpulse
      MARIADB_USER: farmpulse
      MARIADB_PASSWORD: farmpulse
      MARIADB_ROOT_PASSWORD: farmpulse-root
    ports:
      - "3306:3306"
    volumes:
      - farmpulse-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farmpulse-mariadb-data:
