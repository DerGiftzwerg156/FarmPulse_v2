# Docker-spezifische Konfiguration, aktiv ueber SPRING_PROFILES_ACTIVE=docker
# (Standard im Backend-Dockerfile). Ueberschreibt nur die Defaults aus
# application.yml, die ausserhalb eines Containers keinen Sinn ergeben:
# - DB_HOST: "localhost" passt nicht, wenn MariaDB in einem eigenen Container
#   laeuft - im Dev-Compose-Setup (Tools/docker-compose.dev.yml) heisst der
#   MariaDB-Service "mariadb".
# - exchange-dir: der relative Default "./mock-exchange" bezieht sich auf das
#   Arbeitsverzeichnis eines lokalen Checkouts (Repo-Root); im Container wird
#   der Austauschordner stattdessen unter einem festen absoluten Pfad
#   gemountet (siehe Dev-Compose-Setup).
spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:farmpulse}

farmpulse:
  bridge:
    exchange-dir: ${FARMPULSE_BRIDGE_EXCHANGE_DIR:/mock-exchange}
