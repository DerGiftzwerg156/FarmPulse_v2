<div class="space-y-4">
  <div>
    <h1 class="font-display text-2xl font-bold uppercase tracking-[0.06em] text-fp-text">Firmenpostfach</h1>
    <p class="font-body text-[13px] text-fp-muted">
      {{ unreadCount() }} ungelesene Nachrichten · {{ messages().length }} gesamt
    </p>
  </div>

  <section class="rounded-md border border-fp-border bg-fp-panel p-4">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex items-center gap-2 rounded-md border border-fp-border bg-fp-bg px-2 py-1.5">
        <svg lucideSearch class="h-4 w-4 text-fp-muted"></svg>
        <input
          class="w-full bg-transparent font-body text-[13px] text-fp-text placeholder:text-fp-muted focus:outline-none lg:w-64"
          placeholder="Postfach durchsuchen…"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
        />
      </div>
      <button
        type="button"
        class="flex items-center gap-1.5 rounded-sm border px-3 py-1.5 font-display text-[10px] uppercase tracking-[0.14em] transition"
        [class.border-fp-accent]="onlyUnread()"
        [class.text-fp-accent]="onlyUnread()"
        [class.border-fp-border]="!onlyUnread()"
        [class.text-fp-muted]="!onlyUnread()"
        (click)="toggleOnlyUnread()"
      >
        <svg lucideCheck class="h-3.5 w-3.5"></svg>
        Nur ungelesene
      </button>
    </div>
    <div class="mt-3 flex flex-wrap gap-1.5">
      @for (cat of categories; track cat.label) {
        <button
          type="button"
          class="rounded-sm border px-2.5 py-1 font-display text-[10px] uppercase tracking-[0.12em] transition"
          [class.border-fp-accent]="activeCategory() === cat.value"
          [class.bg-fp-accent]="activeCategory() === cat.value"
          [class.bg-opacity-10]="activeCategory() === cat.value"
          [class.text-fp-accent]="activeCategory() === cat.value"
          [class.border-fp-border]="activeCategory() !== cat.value"
          [class.text-fp-muted]="activeCategory() !== cat.value"
          (click)="selectCategory(cat.value)"
        >
          {{ cat.label }}
        </button>
      }
    </div>
  </section>

  @if (filteredMessages().length === 0) {
    <p class="font-body text-sm text-fp-muted">Keine Nachrichten gefunden.</p>
  } @else {
    <div class="space-y-2">
      @for (message of filteredMessages(); track message.id) {
        <button
          type="button"
          class="flex w-full items-center gap-3 rounded-md border bg-fp-panel p-3 text-left transition hover:border-fp-accent/40"
          [class.border-fp-accent]="!message.read"
          [class.border-opacity-30]="!message.read"
          [class.border-fp-border]="message.read"
          (click)="markRead(message)"
        >
          <span
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-sm border"
            [class.border-fp-accent]="!message.read"
            [class.border-opacity-40]="!message.read"
            [class.bg-fp-accent]="!message.read"
            [class.bg-opacity-10]="!message.read"
            [class.text-fp-accent]="!message.read"
            [class.border-fp-border]="message.read"
            [class.text-fp-muted]="message.read"
          >
            @switch (categoryIcon(message.category)) {
              @case ('banknote') { <svg lucideBanknote class="h-4 w-4"></svg> }
              @case ('wrench') { <svg lucideWrench class="h-4 w-4"></svg> }
              @case ('users') { <svg lucideUsers class="h-4 w-4"></svg> }
              @case ('cloud-rain') { <svg lucideCloudRain class="h-4 w-4"></svg> }
              @case ('landmark') { <svg lucideLandmark class="h-4 w-4"></svg> }
              @case ('megaphone') { <svg lucideMegaphone class="h-4 w-4"></svg> }
              @default { <svg lucideMail class="h-4 w-4"></svg> }
            }
          </span>

          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="truncate font-display text-[12px] font-semibold" [class.text-fp-text]="!message.read" [class.text-fp-muted]="message.read">
                {{ message.sender }}
              </span>
              @if (!message.read) {
                <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-fp-accent"></span>
              }
            </div>
            <div class="truncate font-body text-[12px]" [class.text-fp-text]="!message.read" [class.text-fp-muted]="message.read">
              {{ message.subject }}
            </div>
            <div class="mt-0.5 line-clamp-1 font-body text-[11px] text-fp-muted">{{ message.body }}</div>
          </div>

          <div class="hidden shrink-0 flex-col items-end gap-1 sm:flex">
            <span
              class="inline-flex items-center gap-1.5 rounded-sm border border-fp-border bg-fp-bg px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.14em]"
              [class.text-fp-warn]="message.priority === 'HIGH'"
              [class.text-fp-text]="message.priority === 'MEDIUM'"
              [class.text-fp-muted]="message.priority === 'LOW'"
            >
              <span
                class="h-1.5 w-1.5 rounded-full"
                [class.bg-fp-warn]="message.priority === 'HIGH'"
                [class.bg-fp-text]="message.priority === 'MEDIUM'"
                [class.bg-fp-muted]="message.priority === 'LOW'"
              ></span>
              {{ message.priority === 'HIGH' ? 'hoch' : message.priority === 'MEDIUM' ? 'mittel' : 'niedrig' }}
            </span>
            <span class="font-mono text-[10px] text-fp-muted">{{ gameTimeLabel(message) }}</span>
          </div>
        </button>
      }
    </div>
  }
</div>
